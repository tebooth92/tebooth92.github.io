<title>EBA Wiki</title>
<style>
  :root {
    --bg: #f4f6fa;
    --bg-panel: #ffffff;
    --border: #dde1e9;
    --text: #1a1d23;
    --text-muted: #5a6071;
    --accent: #3f51b5;
    --accent-bg: #e8eaf6;
    --accent-hover: #303f9f;
    --sidebar-width: 340px;
    --topbar-height: 38px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1d23;
      --bg-panel: #22262e;
      --border: #33384a;
      --text: #e2e5ed;
      --text-muted: #8890a4;
      --accent: #7986cb;
      --accent-bg: rgba(121,134,203,0.15);
      --accent-hover: #9fa8da;
    }
  }
  :root.theme-light {
    --bg: #f4f6fa;
    --bg-panel: #ffffff;
    --border: #dde1e9;
    --text: #1a1d23;
    --text-muted: #5a6071;
    --accent: #3f51b5;
    --accent-bg: #e8eaf6;
    --accent-hover: #303f9f;
  }
  :root.theme-dark {
    --bg: #1a1d23;
    --bg-panel: #22262e;
    --border: #33384a;
    --text: #e2e5ed;
    --text-muted: #8890a4;
    --accent: #7986cb;
    --accent-bg: rgba(121,134,203,0.15);
    --accent-hover: #9fa8da;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--font); }

  #app { display: grid; grid-template-columns: var(--sidebar-width) 1fr; grid-template-rows: var(--topbar-height) 1fr; height: 100vh; overflow: hidden; }

  /* Topbar */
  #topbar {
    grid-column: 1 / 3;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    height: var(--topbar-height);
    min-height: var(--topbar-height);
  }
  #topbar h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.01em; }
  #topbar .spacer { flex: 1; }
  #topbar a, #topbar button { font: inherit; color: var(--text-muted); font-size: 12px; background: none; border: none; cursor: pointer; padding: 3px 7px; border-radius: 3px; text-decoration: none; }
  #topbar a:hover, #topbar button:hover { background: var(--bg); color: var(--text); }
  #theme-toggle { font-size: 14px; padding: 2px 6px; }

  /* Sidebar */
  #sidebar {
    background: var(--bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #search-wrap {
    padding: 7px 10px 6px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  #search {
    width: 100%;
    padding: 5px 8px;
    font: 12px var(--font);
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg-panel);
    color: var(--text);
    outline: none;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
  #tree { padding: 4px 0 12px; }

  /* Tree items */
  .tree-section { }
  .section-header {
    padding: 5px 10px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .section-header:hover { background: var(--accent-bg); color: var(--text); }

  .eba-header {
    padding: 6px 10px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 600;
    background: var(--bg-panel);
    border-top: 1px solid var(--border);
  }
  .eba-header:hover { background: var(--accent-bg); }

  .part-header {
    padding: 4px 10px 4px 24px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .part-header:hover { background: var(--accent-bg); color: var(--text); }

  .caret {
    display: inline-block;
    width: 10px;
    flex: 0 0 10px;
    transition: transform 0.12s;
    font-size: 9px;
    line-height: 1;
    text-align: center;
    color: var(--text-muted);
  }
  .collapsed > .section-children,
  .collapsed > .eba-children,
  .collapsed > .part-children { display: none; }
  .collapsed .caret { transform: rotate(-90deg); }

  .page-item {
    padding: 3px 10px 3px 36px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
    border-left: 3px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.5;
  }
  .page-item:hover { background: var(--accent-bg); }
  .page-item.selected { background: var(--accent-bg); border-left-color: var(--accent); color: var(--accent); font-weight: 500; }

  /* Depth indentation for page items */
  .depth-0 { padding-left: 14px; }
  .depth-1 { padding-left: 14px; }
  .depth-2 { padding-left: 28px; }
  .depth-3 { padding-left: 42px; }

  /* Main content area */
  #main { overflow: hidden; display: flex; flex-direction: column; background: var(--bg-panel); }
  #content {
    flex: 1;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    min-height: 0;
  }

  /* Search filter hides non-matching items */
  .tree-hidden { display: none !important; }

  @media (max-width: 700px) {
    :root { --sidebar-width: 260px; }
  }
</style>

const WIKI_BASE = (function() {
  // Determine the base URL for the wiki.
  // Handles all deployment scenarios:
  //   /shell.html              -> /          (mkdocs serve, raw file)
  //   /index.html  or  /       -> /          (after build.bat copies shell to root)
  //   /eba/shell.html          -> /eba/      (GitHub Pages, direct access)
  //   /eba/  or  /eba/index.html -> /eba/    (GitHub Pages, after build.bat copy)
  var path = window.location.pathname;
  // Strip trailing filename (.html files)
  var base = path.replace(/\/[^/]+\.html$/, '/');
  // Strip trailing /shell segment if present (future-proof)
  base = base.replace(/\/shell\/?$/, '/');
  // Ensure trailing slash
  if (!base.endsWith('/')) base += '/';
  return base;
})();

const STORAGE_STATE = 'eba-wiki-shell-state';
const STORAGE_SCROLL = 'eba-wiki-shell-scroll';
const STORAGE_THEME = 'eba-wiki-shell-theme';

let currentUrl = null;

// --- Theme ---
function applyTheme(theme) {
  document.documentElement.classList.remove('theme-light', 'theme-dark');
  if (theme) document.documentElement.classList.add('theme-' + theme);
  try { localStorage.setItem(STORAGE_THEME, theme || ''); } catch(e) {}
}
function initTheme() {
  try {
    var saved = localStorage.getItem(STORAGE_THEME);
    if (saved) applyTheme(saved);
  } catch(e) {}
}
document.getElementById('theme-toggle').addEventListener('click', function() {
  var isDark = document.documentElement.classList.contains('theme-dark') ||
    (!document.documentElement.classList.contains('theme-light') &&
     window.matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(isDark ? 'light' : 'dark');
});

// --- Open in new tab ---
document.getElementById('open-new-tab').addEventListener('click', function(e) {
  e.preventDefault();
  var href = this.href;
  if (href && href !== '#') window.open(href, '_blank', 'noopener');
});

// --- Section state persistence ---
function loadState() {
  try { var raw = localStorage.getItem(STORAGE_STATE); return raw ? JSON.parse(raw) : {}; }
  catch(e) { return {}; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_STATE, JSON.stringify(state)); } catch(e) {}
}
function loadScroll() {
  try { return parseInt(localStorage.getItem(STORAGE_SCROLL) || '0', 10); } catch(e) { return 0; }
}
function saveScroll() {
  try { localStorage.setItem(STORAGE_SCROLL, String(document.getElementById('sidebar').scrollTop)); } catch(e) {}
}

// --- Build nav tree ---
var openState = loadState();

function makeSecId(path) {
  return 'sec-' + path.replace(/[^a-z0-9]/gi, '-');
}

function buildTree(items, depth, parentPath) {
  var frag = document.createDocumentFragment();
  items.forEach(function(item, idx) {
    var itemPath = (parentPath || '') + '/' + idx;
    if (item.type === 'page') {
      var el = document.createElement('div');
      el.className = 'page-item depth-' + Math.min(depth, 3);
      el.textContent = item.title;
      el.dataset.url = item.url;
      el.addEventListener('click', function() { navigate(item.url); });
      frag.appendChild(el);
    } else if (item.type === 'section') {
      var secEl = document.createElement('div');
      secEl.className = 'tree-section';
      var secId = makeSecId(itemPath);
      secEl.dataset.secId = secId;

      var headerClass = depth === 0 ? 'section-header' : depth === 1 ? 'eba-header' : 'part-header';
      var childClass  = depth === 0 ? 'section-children' : depth === 1 ? 'eba-children' : 'part-children';

      var header = document.createElement('div');
      header.className = headerClass;
      var caret = document.createElement('span');
      caret.className = 'caret';
      caret.innerHTML = '&#9660;';
      header.appendChild(caret);
      var label = document.createElement('span');
      label.textContent = item.title;
      header.appendChild(label);

      var childWrap = document.createElement('div');
      childWrap.className = childClass;

      // Collapse by default at EBA-and-below depth; top-level sections start open
      var defaultCollapsed = depth >= 1;
      if (openState[secId] === true)  defaultCollapsed = false;
      if (openState[secId] === false) defaultCollapsed = true;
      if (defaultCollapsed) secEl.classList.add('collapsed');

      header.addEventListener('click', function() {
        var isNowCollapsed = secEl.classList.toggle('collapsed');
        openState[secId] = !isNowCollapsed;
        saveState(openState);
      });

      secEl.appendChild(header);
      secEl.appendChild(childWrap);
      childWrap.appendChild(buildTree(item.children || [], depth + 1, itemPath));
      frag.appendChild(secEl);
    }
  });
  return frag;
}

var treeEl = document.getElementById('tree');
treeEl.appendChild(buildTree(NAV_DATA, 0, ''));

// --- Navigate ---
function navigate(url, fromIframe) {
  var iframe = document.getElementById('content');

  // Empty or root URLs would point the iframe back at the shell itself,
  // causing recursive embedding. Redirect to the renamed home page.
  if (!url || url === '/' || url === '') {
    url = 'home/';
  }

  var fullUrl = WIKI_BASE + url;

  // file:// browsers don't auto-serve index.html from directory URLs.
  // If we're running from file:// and the URL ends in /, append index.html
  // so the iframe loads the page rather than a directory listing.
  if (window.location.protocol === 'file:' && fullUrl.endsWith('/')) {
    fullUrl = fullUrl + 'index.html';
  }

  if (!fromIframe) {
    var sep = fullUrl.includes('?') ? '&' : '?';
    iframe.src = fullUrl + sep + 'embed=1';
  }

  currentUrl = url;
  history.replaceState(null, '', '#/' + url);
  document.getElementById('open-new-tab').href = fullUrl;

  // Update selected highlight
  document.querySelectorAll('.page-item').forEach(function(el) {
    el.classList.toggle('selected', el.dataset.url === url);
  });

  // Ensure parent sections are open and scroll item into view
  document.querySelectorAll('.page-item').forEach(function(el) {
    if (el.dataset.url !== url) return;
    var parent = el.parentElement;
    while (parent && parent !== treeEl) {
      if (parent.classList.contains('tree-section')) {
        parent.classList.remove('collapsed');
        var sid = parent.dataset.secId;
        if (sid) { openState[sid] = true; }
      }
      parent = parent.parentElement;
    }
    saveState(openState);
    // Scroll into view
    var sidebar = document.getElementById('sidebar');
    var itemTop = el.offsetTop;
    var sideH = sidebar.clientHeight;
    var sideScroll = sidebar.scrollTop;
    if (itemTop < sideScroll + 60 || itemTop > sideScroll + sideH - 60) {
      sidebar.scrollTop = itemTop - sideH / 3;
    }
  });
}

// --- Iframe load: add embed class, detect URL ---
var contentFrame = document.getElementById('content');
contentFrame.addEventListener('load', function() {
  try {
    var doc = contentFrame.contentDocument || contentFrame.contentWindow.document;
    if (doc && doc.body) doc.body.classList.add('embed');
  } catch(e) {}

  try {
    var iframeHref = contentFrame.contentWindow.location.href;
    var baseHref = window.location.origin + WIKI_BASE;
    if (iframeHref.startsWith(baseHref)) {
      var relPath = iframeHref.slice(baseHref.length).replace(/[?#].*$/, '');
      if (relPath && !relPath.includes('.') && !relPath.endsWith('/')) relPath += '/';
      if (relPath !== currentUrl) navigate(relPath, true);
    }
  } catch(e) {}
});

// --- Nav filter / search ---
document.getElementById('search').addEventListener('input', function() {
  var q = this.value.trim().toLowerCase();
  if (!q) {
    document.querySelectorAll('.tree-hidden').forEach(function(el) { el.classList.remove('tree-hidden'); });
    return;
  }
  // Hide all page items that don't match; show those that do
  document.querySelectorAll('.page-item').forEach(function(el) {
    var match = el.textContent.toLowerCase().includes(q);
    el.classList.toggle('tree-hidden', !match);
    if (match) {
      // Expand parents
      var p = el.parentElement;
      while (p && p !== treeEl) {
        if (p.classList.contains('tree-section')) p.classList.remove('collapsed');
        p = p.parentElement;
      }
    }
  });
  // Hide section headers that have no visible children
  document.querySelectorAll('.tree-section').forEach(function(sec) {
    var hasVisible = sec.querySelector('.page-item:not(.tree-hidden)');
    sec.classList.toggle('tree-hidden', !hasVisible);
  });
});

// --- Hash routing ---
function getHashUrl() {
  var h = window.location.hash;
  if (h.startsWith('#/')) return h.slice(2);
  return null;
}

function init() {
  initTheme();
  var hashUrl = getHashUrl();
  // Default to the renamed home page. Empty string would point at root,
  // but root IS the shell (after build.bat copies shell.html over index.html),
  // which would cause the iframe to recursively load the shell.
  navigate(hashUrl !== null && hashUrl !== '' ? hashUrl : 'home/');
  setTimeout(function() {
    var s = loadScroll();
    if (s) document.getElementById('sidebar').scrollTop = s;
  }, 80);
}

window.addEventListener('hashchange', function() {
  var url = getHashUrl();
  if (url !== null && url !== currentUrl) navigate(url);
});

document.getElementById('sidebar').addEventListener('scroll', saveScroll, {passive: true});

init();
</script>
