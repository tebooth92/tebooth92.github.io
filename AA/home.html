<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Payroll Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div class="max-w-6xl mx-auto px-8 py-12">
        <header class="mb-10">
            <h1 class="text-3xl font-bold text-slate-900">Payroll Tools</h1>
            <p class="text-slate-500 mt-2">Choose a tool to get started, or use the menu on the left.</p>
        </header>

        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">Pay Related</h2>
        <div id="grid-salary" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-12"></div>

        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">Checks</h2>
        <div id="grid-other" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <script>
        const ICONS = {
            currency: "M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z",
            audit:    "M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4",
            remit:    "M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z",
            report:   "M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z",
            scale:    "M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3",
            card:     "M3 10h18M7 15h1m4 0h2m-9 4h12a2 2 0 002-2V7a2 2 0 00-2-2H6a2 2 0 00-2 2v10a2 2 0 002 2z",
            search:   "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z",
            person:   "M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z",
            receipt:  "M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z",
            calc:     "M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z",
            bank:     "M3 10h18M5 10v10m14-10v10M9 10v10m6-10v10M2 20h20M12 3l9 5H3l9-5z",
            vehicle:  "M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0zM13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1"
        };
        const SALARY = [
            { key:'pay-processing', icon:'currency', title:'Pay Processing',     desc:'Process pre-tax & post-tax salary packaging deductions and reconcile GST.' },
            { key:'cutoff',         icon:'report',   title:'Pay Cutoff',         desc:'Reconcile projected deductions against actual payroll.' },
            { key:'audit',          icon:'audit',    title:'Pre-Payment Audit',  desc:'Validate package benefit details before payment, including account rules and EML card checks against the active ME and LE reports.' },
            { key:'remittance',     icon:'remit',    title:'Remittance',         desc:'Generate EML and novated lease remittance files and the pay detail report.' },
            { key:'gst-itc',        icon:'calc',     title:'GSTITC',             desc:'Combine employer list files, apply adjustments and download the GST ITC claimable summary.' },
            { key:'reconciler',     icon:'scale',    title:'Reconcile Pay',      desc:'Compare payroll files and surface variances across them.' },
        ];
        const OTHER = [
            { key:'eml-onboarding', icon:'person',   title:'EML Onboarding',     desc:'Find newly signed-up employees with active cards but no schedule, and terminated cards still scheduled.' },
            { key:'fee-audit',      icon:'receipt',  title:'Fee Audit',          desc:'Check every employee with living expenses or meal entertainment benefits collects the full FBT-year admin fee.' },
            { key:'opportunity',    icon:'search',   title:'Opportunity',        desc:'Find active employees who are not salary packaging.' },
            { key:'held-balance',   icon:'bank',     title:'Held Balance',       desc:'Held employee funds, over-deductions and terminated balances.' },
            { key:'fbt-rec',        icon:'vehicle',  title:'FBT Reconciliation', desc:'Look up a novated lease by registration, work out the post-tax shortfall and FBT, and split a supplier refund into GST, FBT and employee refund with a PDF export.' },
        ];

        function tile(t) {
            return `<a href="index.html#${t.key}" target="_top"
                class="group block bg-white rounded-xl border border-slate-200 p-6 shadow-sm hover:shadow-md hover:border-indigo-300 hover:-translate-y-0.5 transition-all">
                <div class="w-12 h-12 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center mb-4 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${ICONS[t.icon]}"></path></svg>
                </div>
                <h3 class="text-lg font-semibold text-slate-900 mb-1">${t.title}</h3>
                <p class="text-sm text-slate-500 leading-relaxed">${t.desc}</p>
            </a>`;
        }
        document.getElementById('grid-salary').innerHTML = SALARY.map(tile).join('');
        document.getElementById('grid-other').innerHTML  = OTHER.map(tile).join('');
    </script>
</body>
</html>
